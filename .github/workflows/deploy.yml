# ==============================================================================
# main にマージされた変更を、共有プロジェクトに反映する
#   platform : platform/** か apps/*/firestore.rules が変わったら、Terraform SA で plan → apply
#              （テナントの払い出しと Security Rules の反映。Rules を反映できるのはこの経路だけ）
#              2 つのレーンがある（docs/platform_design.md §3.4）
#                承認つき : plan を確認して承認してから apply（Environment "platform"）
#                自動     : 変わったのがセルフサービスの台帳（platform/catalog/self-service/）だけで、
#                           plan の中身もそのアプリのテナントの作成・変更だけのとき（plan-guard.mjs）。承認なしで apply
#   apps     : apps/<app>/** が変わったアプリだけを、デプロイ SA（fga-deployer）で firebase deploy
#              （Hosting・Functions・インデックス。Rules は含めない）
#
# 必要な設定（docs/runbook.md §6）:
#   - リポジトリの変数 GCP_WIF_PROVIDER（未設定の間は何もしない）
#   - Environment "platform"（Required reviewers にエンジニア組織。apply の前に plan を確認して承認する）
#   - 予算アラート・監査アラートの設定は platform/config.json（リポジトリの変数は使わない）
# 認証は Workload Identity Federation（鍵なし）。SA を借用できるのは main で動くこのワークフローだけ。
# ==============================================================================
name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      platform:
        description: platform（Terraform）を反映する
        type: boolean
        default: false
      app:
        description: デプロイするアプリの id（all で全アプリ。空ならデプロイしない）
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  changes:
    name: 変更の検出
    if: vars.GCP_WIF_PROVIDER != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      platform: ${{ steps.detect.outputs.platform }}
      self_service_only: ${{ steps.detect.outputs.self_service_only }}
      apps: ${{ steps.detect.outputs.apps }}
      project_id: ${{ steps.detect.outputs.project_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: detect
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          INPUT_PLATFORM: ${{ inputs.platform }}
          INPUT_APP: ${{ inputs.app }}
        run: |
          set -euo pipefail
          all_apps() { find apps -mindepth 1 -maxdepth 1 -type d -exec basename {} \; | sort; }
          platform=false
          self_service_only=false
          apps=""
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            platform="$INPUT_PLATFORM"
            if [[ "$INPUT_APP" == "all" ]]; then
              apps="$(all_apps)"
            elif [[ -n "$INPUT_APP" ]]; then
              [[ "$INPUT_APP" =~ ^[a-z][a-z0-9-]{2,18}[a-z0-9]$ && -d "apps/$INPUT_APP" ]] || { echo "::error::apps/$INPUT_APP がありません"; exit 1; }
              apps="$INPUT_APP"
            fi
          elif [[ -z "$BEFORE" || "$BEFORE" =~ ^0+$ ]] || ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            # 比べる相手がない（最初の push など）ときは、すべて反映する
            platform=true
            apps="$(all_apps)"
          else
            changed="$(git diff --name-only "$BEFORE" "$GITHUB_SHA")"
            platform_changed="$(grep -E '^(platform/|apps/[^/]+/firestore\.rules$)' <<<"$changed" || true)"
            if [[ -n "$platform_changed" ]]; then
              platform=true
              # 基盤に関わる変更が、セルフサービスの台帳だけか（自動で反映するレーンの候補）
              if ! grep -qvE '^platform/catalog/self-service/[^/]+$' <<<"$platform_changed"; then self_service_only=true; fi
            fi
            if grep -qE '^(platform/config\.json|pnpm-lock\.yaml|scripts/deploy_app\.sh)$' <<<"$changed"; then
              # 全アプリのビルド結果・デプロイ方法に関わる変更
              apps="$(all_apps)"
            else
              apps="$(grep -E '^apps/[^/]+/' <<<"$changed" | grep -vE '^apps/[^/]+/firestore\.rules$' | cut -d/ -f2 | sort -u || true)"
            fi
          fi
          # 削除されたアプリは除く
          apps_json="$(for app in $apps; do [[ -d "apps/$app" ]] && echo "$app"; done | jq -R . | jq -sc .)"
          {
            echo "platform=$platform"
            echo "self_service_only=$self_service_only"
            echo "apps=$apps_json"
            echo "project_id=$(jq -r .project_id platform/config.json)"
          } >> "$GITHUB_OUTPUT"
          echo "platform=$platform self_service_only=$self_service_only apps=$apps_json"

  platform-plan:
    name: platform / terraform plan
    needs: changes
    if: needs.changes.outputs.platform == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    outputs:
      lane: ${{ steps.lane.outputs.lane }}
    env:
      TF_IN_AUTOMATION: "true"
      TF_VAR_google_oauth_client_id: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
      TF_VAR_google_oauth_client_secret: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
      PROJECT_ID: ${{ needs.changes.outputs.project_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: terraform-sa@${{ needs.changes.outputs.project_id }}.iam.gserviceaccount.com
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_wrapper: false
      - run: terraform -chdir=platform/terraform init -input=false -backend-config="bucket=${PROJECT_ID}-tfstate"
      - name: terraform plan（承認つきのレーンでは、この内容を確認してから platform-apply を承認する）
        run: terraform -chdir=platform/terraform plan -input=false -lock-timeout=5m -out=platform.tfplan
      - name: レーンの判定（承認なしで反映してよい plan か）
        id: lane
        env:
          SELF_SERVICE_ONLY: ${{ needs.changes.outputs.self_service_only }}
        run: |
          set -euo pipefail
          lane=review
          if [[ "$SELF_SERVICE_ONLY" == "true" ]]; then
            terraform -chdir=platform/terraform show -json platform.tfplan > "$RUNNER_TEMP/plan.json"
            if node platform/policies/plan-guard.mjs "$RUNNER_TEMP/plan.json"; then lane=auto; fi
          fi
          echo "lane=$lane" >> "$GITHUB_OUTPUT"
          echo "platform の反映: **$lane**（auto = 承認なし / review = 承認つき）" >> "$GITHUB_STEP_SUMMARY"

  platform-apply:
    name: platform / terraform apply（承認つき）
    needs: [changes, platform-plan]
    if: needs.platform-plan.outputs.lane != 'auto'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Required reviewers を設定した Environment。承認されるまでこのジョブは始まらない
    environment: platform
    permissions:
      contents: read
      id-token: write
    env:
      TF_IN_AUTOMATION: "true"
      TF_VAR_google_oauth_client_id: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
      TF_VAR_google_oauth_client_secret: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
      PROJECT_ID: ${{ needs.changes.outputs.project_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: terraform-sa@${{ needs.changes.outputs.project_id }}.iam.gserviceaccount.com
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_wrapper: false
      - run: terraform -chdir=platform/terraform init -input=false -backend-config="bucket=${PROJECT_ID}-tfstate"
      - name: terraform apply（テナントの払い出し・Security Rules の反映）
        run: terraform -chdir=platform/terraform apply -input=false -auto-approve -lock-timeout=5m

  platform-apply-auto:
    name: platform / terraform apply（自動：セルフサービスのアプリだけ）
    needs: [changes, platform-plan]
    if: needs.platform-plan.outputs.lane == 'auto'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    env:
      TF_IN_AUTOMATION: "true"
      TF_VAR_google_oauth_client_id: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
      TF_VAR_google_oauth_client_secret: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
      PROJECT_ID: ${{ needs.changes.outputs.project_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: terraform-sa@${{ needs.changes.outputs.project_id }}.iam.gserviceaccount.com
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_wrapper: false
      - run: terraform -chdir=platform/terraform init -input=false -backend-config="bucket=${PROJECT_ID}-tfstate"
      # plan を取り直し、同じ検査を通った plan そのものを apply する（判定の後に main が変わっていても、検査した内容だけが反映される）
      - name: terraform plan
        run: terraform -chdir=platform/terraform plan -input=false -lock-timeout=5m -out=platform.tfplan
      - name: 承認なしで反映してよい plan かを確かめる
        run: |
          set -euo pipefail
          terraform -chdir=platform/terraform show -json platform.tfplan > "$RUNNER_TEMP/plan.json"
          node platform/policies/plan-guard.mjs "$RUNNER_TEMP/plan.json"
      - name: terraform apply（セルフサービスのアプリのテナントの払い出し）
        run: terraform -chdir=platform/terraform apply -input=false -lock-timeout=5m platform.tfplan

  apps:
    name: app / ${{ matrix.app }}
    needs: [changes, platform-apply, platform-apply-auto]
    # platform の反映が要るときは、その後で（新しいアプリのテナントが先に必要なため）。失敗・却下されたらデプロイしない
    if: >-
      always() &&
      needs.changes.result == 'success' &&
      needs.changes.outputs.apps != '[]' &&
      (needs.changes.outputs.platform != 'true' ||
       needs.platform-apply.result == 'success' ||
       needs.platform-apply-auto.result == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        app: ${{ fromJSON(needs.changes.outputs.apps) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - run: corepack enable pnpm
      - run: pnpm install --frozen-lockfile
      - name: ポリシーチェック（デプロイの直前にもう一度）
        run: pnpm policy
      - name: テストとビルド
        run: |
          pnpm test
          pnpm build
      # 認証情報は、ビルド・テストが終わってから取得する
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: fga-deployer@${{ needs.changes.outputs.project_id }}.iam.gserviceaccount.com
      - name: firebase deploy（Hosting・Functions・インデックス。Rules は含めない）
        env:
          APP_ID: ${{ matrix.app }}
        run: ./scripts/deploy_app.sh "$APP_ID"
