# ==============================================================================
# アプリ台帳（エンジニア組織がレビューするアプリ。変更は CODEOWNERS でレビュー必須）
#
# 台帳は 2 か所ある（docs/platform_design.md §3.4）:
#   このファイル                  : 独自の Security Rules・シークレット・外部への送信・Tier 1 のどれかがあるアプリ。
#                                   PR でエンジニア組織がレビューし、反映（terraform apply）の前にも承認する
#   self-service/<app id>.yaml    : 標準の型に収まる Tier 0 のアプリ。レビューも承認もなしで反映する
#                                   （型から外れた内容は、CI のポリシーチェックが止める）
#
# ここに 1 件追加する PR がマージされると、platform の Terraform が
# 共有プロジェクト内に「テナント」を払い出す：
#   Hosting サイト fga-<id> / Firestore DB <id> / Web アプリ登録と制限付き API キー /
#   実行 SA app-<id>@ / シークレットの入れ物 <ID>_<NAME>（英大文字・アンダースコア。例: NEWS_WATCHER_SLACK_WEBHOOK_GENERAL） /
#   Security Rules / TTL
#
# キー（app id）  : 英小文字・数字・ハイフン、4〜20 文字
# tier            : 0 = セルフサービス / 1 = 軽いレビュー（Tier 2 は専用 PJ に切り出すので、ここには載せない）
# data_class      : public | internal | confidential（Tier 0 は internal まで）
# handles_pii     : 個人情報・顧客データを扱うか（Tier 0 は false だけ）
# rules_template  : internal-team-collab | internal-author-only（platform/rules-templates/ の標準テンプレート）
#                   | custom（apps/<id>/firestore.rules を書く）
# external_egress : 外部への送信先の名前（なければ []）
# ttl_collections : （任意）期限を過ぎたドキュメントを自動で消すコレクション（フィールド expiresAt に期限を入れる）
# budget_jpy      : （任意）ラベル app=<id> 単位の月額予算（円）。超えそうになると通知する
# owners          : アプリのオーナー（IAM メンバー形式）。Google グループ fga-<id>-owners@ を推奨（検証なら user:alice@example.com でもよい）
# admins          : アプリ内の最初の admin（Firestore の members/{email} に role=admin で登録される）
# expires         : 有効期限（YYYY-MM-DD）。期限を過ぎると CI のポリシーチェックが失敗する（延長するか、アプリを停止する）
# secrets         : 必要なシークレットの名前（値はオーナーが登録する。Terraform は入れ物だけを作る）
# ==============================================================================

apps:
  news-watcher:
    display_name: News Watcher
    description: 社内のニュースチャンネルに、業務に必要な情報を自動で集めて共有する
    tier: 0
    department: corp-planning
    data_class: internal
    handles_pii: false
    rules_template: custom
    external_egress:
      - rss-feeds-https
      - slack-webhook-general
    budget_jpy: 5000
    owners:
      - group:fga-news-watcher-owners@example.com
    admins:
      - owner@example.com
    expires: "2027-03-31"
    secrets:
      - slack-webhook-general
